name: Delivery pipeline
on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t delivery-api:scan .
      - name: Fail on fixable critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 delivery-api:scan
      - name: Container starts and passes its health check
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 delivery-api:scan
          for i in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && break
            sleep 3
          done
          docker inspect -f '{{.State.Health.Status}}' api | grep -x healthy
          [ "$(docker exec api id -u)" = 10001 ]

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform -chdir=terraform fmt -check
      - name: Create a Kubernetes cluster
        run: kind create cluster --name delivery --wait 120s
      - name: Build release images and load them into the cluster
        run: |
          docker build -t delivery-api:v1 .
          docker tag delivery-api:v1 delivery-api:v2
          kind load docker-image delivery-api:v1 delivery-api:v2 --name delivery
      - name: Provision the namespace with Terraform
        run: |
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform validate
          terraform -chdir=terraform apply -input=false -auto-approve
          terraform -chdir=terraform plan -input=false -detailed-exitcode
      - name: Deploy, upgrade, fail and roll back
        run: |
          mkdir -p results
          bash scripts/rollout_test.sh 2>&1 | tee results/rollout.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl get all -A || true
          kubectl -n delivery describe pods || true
          kubectl -n delivery get events --sort-by=.lastTimestamp || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-evidence
          path: results/
          if-no-files-found: ignore
