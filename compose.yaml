# Local run: docker compose up --build, then open http://127.0.0.1:8000 and http://127.0.0.1:9090
services:
  api:
    build: .
    environment:
      APP_VERSION: compose
      APP_ENVIRONMENT: local
    ports:
      - "127.0.0.1:8000:8000"
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
